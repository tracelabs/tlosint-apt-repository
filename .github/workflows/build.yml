# Build, lint and install-test every package.
#
# This workflow NEVER signs. The signing key is not in Actions secrets and must
# not be: anyone who can land a workflow change could otherwise sign packages
# that users' systems trust. CI produces unsigned .deb artifacts; a human
# downloads them and runs publish/publish.sh locally.
#
# Jobs run inside a Debian container rather than on the Ubuntu host. Ubuntu's
# debian-archive-keyring stops at bookworm, so mmdebstrap bootstrapping trixie
# on the host fails signature verification with NO_PUBKEY. Debian's own image
# has the right keys by definition.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DIST: trixie
  ARCH: amd64

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # sbuild --chroot-mode=unshare creates user namespaces from inside this
      # container. Docker's default seccomp profile blocks that, and on
      # Ubuntu 24.04 hosts the default AppArmor profile plus
      # kernel.apparmor_restrict_unprivileged_userns does too.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      # Before checkout: actions/checkout wants git, and the Debian image has
      # neither git nor the build tooling.
      - name: Install build tooling
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            sbuild mmdebstrap uidmap zstd lintian shellcheck \
            python3-yaml make git ca-certificates

      - uses: actions/checkout@v4

      # sbuild refuses to run as root, and the container's default user is
      # root. Everything after this point runs as an unprivileged builder.
      - name: Create unprivileged builder
        run: |
          useradd -m -u 1001 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # newuidmap needs an allocated subordinate range. useradd does not
          # always write one, and without it unshare mode falls back to a
          # single-uid mapping.
          grep -q '^builder:' /etc/subuid || echo 'builder:100000:65536' >> /etc/subuid
          grep -q '^builder:' /etc/subgid || echo 'builder:100000:65536' >> /etc/subgid

      - name: Cache chroot
        id: chroot-cache
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/sbuild
          key: sbuild-${{ env.DIST }}-${{ env.ARCH }}-${{ hashFiles('build/mk-chroot.sh') }}

      - name: Build chroot
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        run: runuser -u builder -- make chroot

      - name: Build packages
        run: runuser -u builder -- make build

      - name: Lint
        run: runuser -u builder -- make lint

      - name: Upload unsigned packages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ env.DIST }}-${{ env.ARCH }}
          path: |
            artifacts/*.deb
            artifacts/*.changes
            artifacts/*.buildinfo
          if-no-files-found: error
          retention-days: 30

  # Separate job so the install test runs against a genuinely clean trixie,
  # not the one carrying the whole build toolchain. This is also the job that
  # would catch a missing runtime Depends that the build environment masked.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ env.DIST }}-${{ env.ARCH }}
          path: artifacts

      # NATIVE=1: the job container is already the clean environment, and no
      # Docker daemon is reachable from inside it.
      - name: Install test
        run: NATIVE=1 build/install-test.sh "$DIST"
