  summary: Automated archiving of web resources

# =============================================================================
# Deliberately excluded from the default set.
# =============================================================================

- name: archivebox
  kind: python
  status: gated
  source: https://github.com/ArchiveBox/ArchiveBox
  summary: Self-hosted web archiving
  notes: >
    Upstream gates this behind TLOSINT_INSTALL_ARCHIVEBOX=1 on VM image size.
    Same reasoning applies to a template; keep it opt-in.

- name: twscrape
  kind: python
  status: gated
  source: https://github.com/vladkens/twscrape
  summary: Twitter/X scraping
  notes: >
    Upstream gates this behind TLOSINT_ENABLE_TWSCRAPE=1 pending a Trace Labs
    ToS review (docs/TOOLING_POLICY.md). Do not ship by default.

