# Single source of truth for the OSINT tool set.
#
# Generates: tlosint-meta Depends, README table.
# Never hardcode the tool list anywhere else.
#
# Inventoried 2026-09-16 against tracelabs/tlosint-vm branch u/191-socmint-tools,
# scripts/tlosint-tools.sh. Availability checked against Debian 13 (trixie).
#
# kind:
#   distro  - already in Debian; tlosint-meta just depends on it
#   python  - own venv under /opt/tracelabs/<name> via dh-virtualenv
#   go      - built from source, static binary to /opt/tracelabs/<name>
#   rust    - cargo build; see handoff section 6, no template exists yet
#   binary  - upstream release binary, checksum-pinned
#   docker  - upstream ships only a container image; see handoff section 6
#
# status:
#   ready   - packaged (or in Debian) and safe to pull into tlosint-meta
#   planned - inventoried, not yet packaged. NOT in Depends.
#   gated   - deliberately excluded from the default set; opt-in only
#
# Only status:ready entries become tlosint-meta dependencies.

# =============================================================================
# In Debian trixie already. Zero packaging work -- just depend on them.
# =============================================================================

