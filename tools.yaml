# =============================================================================
# Not in trixie. Need real packaging -- these are the actual work.
# =============================================================================

- name: phoneinfoga
  kind: go
  status: planned
  source: https://github.com/sundowndev/phoneinfoga
  summary: Information gathering for phone numbers

- name: gowitness
  kind: go
  status: planned
  source: https://github.com/sensepost/gowitness
  summary: Web screenshot utility

- name: maigret
  kind: python
  status: ready
  version: 0.6.5
  source: https://github.com/soxoj/maigret
  summary: Collect a dossier on a person by username

- name: ghunt
  kind: python
  status: ready
  version: 2.3.4
  source: https://github.com/mxrch/GHunt
  summary: Google account OSINT
  notes: >
    Requires Google account cookies (run "ghunt login" once per user; stored in
    ~/.malfrats/ghunt). The package deliberately does not provision them at
    install time -- they are per-user and cannot be obtained unattended.
    Upstream defers the same way via /etc/osint/skip-ghunt-login.
    AGPL-3.0, so debian/copyright carries the full licence text: trixie's
    /usr/share/common-licenses has no AGPL-3.

- name: whatsmyname
  kind: python
  status: ready
  version: 1.3.0+git20260429.0976982
  source: https://github.com/C3n7ral051nt4g3ncy/WhatsMyName-Python
  summary: Username enumeration across sites
  notes: >
    Not on PyPI and carries no git tags, so it is pinned by commit archive with
    a sha256 -- see packages/whatsmyname/debian/upstream.pin.
    REQUIRES NETWORK TO RUN AT ALL: it downloads wmn-data.json from the upstream
    project before it parses its own arguments, so even --help fails offline.
    The site list is never shipped. Relevant to the Qubes template, where an
    airgapped VM cannot use it.

- name: carbon14
  kind: python
  status: ready
  version: 1.0.0
  source: https://github.com/Lazza/Carbon14
  summary: OSINT dating of web content

- name: spiderfoot
  kind: python
  status: planned
  source: https://github.com/smicallef/spiderfoot
  summary: Automated OSINT reconnaissance
  notes: >
    Upstream pins lxml<5, which fails to compile on Python 3.13 (trixie).
    Upstream's script relaxes the pin at install time; the package must pin a
    working set with hashes instead.

- name: metagoofil
  kind: python
  status: ready
  version: 1.4.0
  source: https://github.com/opsdisk/metagoofil
  summary: Extract metadata from public documents
  notes: >
    Ships neither setup.py nor pyproject.toml, so pip cannot install it. The
    venv holds dependencies only; the upstream tree is fetched from a pinned
    commit archive and laid down beside it with a hand-written wrapper. This is
    the reference "tier C" package -- see packages/metagoofil/debian/upstream.pin.
    Note: metagoofil.py opens user_agents.txt relative to the CURRENT DIRECTORY,
    so -u with the shipped list only resolves when run from the install tree.

- name: sn0int
  kind: rust
  status: planned
  source: https://github.com/kpcyrd/sn0int
  summary: Semi-automatic OSINT framework and package manager
  notes: >
    Upstream installs this from apt.vulns.xyz, whose key lands in
    /etc/apt/trusted.gpg.d -- a trust root for every repo on the system.
    Replacing that is a reason this repository exists.

- name: monolith
  kind: rust
  status: planned
  source: https://github.com/Y2Z/monolith
  summary: Save a web page as a single self-contained HTML file

- name: translate-shell
  kind: binary
  status: planned
  source: https://github.com/soimort/translate-shell
  summary: Command line translator
  notes: Was in Debian, not in trixie. Single POSIX shell script.

- name: torbrowser-launcher
  kind: binary
  status: planned
  source: https://github.com/micahflee/torbrowser-launcher
  summary: Tor Browser downloader and launcher
  notes: >
    Not in trixie. Downloads Tor Browser at runtime, which a Qubes template
    build cannot do -- see handoff section 6.

