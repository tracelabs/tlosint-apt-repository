// apt-ftparchive keeps no database, so publish is fully idempotent against
// a stateless CI and a git branch used as storage.

Dir {
    ArchiveDir "./";
};

TreeDefault {
    Directory        "pool/$(SECTION)";
    SrcDirectory     "pool/$(SECTION)";
    Packages         "$(DIST)/$(SECTION)/binary-$(ARCH)/Packages";
    Contents         "$(DIST)/Contents-$(ARCH)";
};

Tree "dists/stable" {
    Sections   "main";
    Architectures "amd64 all";
};

Default {
    Packages::Compress ". gzip xz";
    Contents::Compress ". gzip";
};

// By-hash: index files are also written under by-hash/SHA256/<hash>, so a
// client that read Release just before a publish still fetches the exact file
// that Release names, rather than a newer one at the plain path. This takes
// two settings: DoByHash writes the files, and Acquire-By-Hash in Release tells
// clients to use them. The Release flag alone points clients at paths that
// don't exist.
APT::FTPArchive::DoByHash "true";

APT::FTPArchive::Release {
    Acquire-By-Hash "yes";
    Origin      "Trace Labs";
    Label       "tlosint";
    Suite       "stable";
    Codename    "stable";
    Architectures "amd64 all";
    Components  "main";
    Description "Trace Labs OSINT tools";
};
