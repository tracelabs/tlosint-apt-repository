// apt-ftparchive keeps no database, so publish is fully idempotent against
// a stateless CI and a git branch used as storage.

Dir {
    ArchiveDir "./";
};

TreeDefault {
    Directory        "pool/$(SECTION)";
    SrcDirectory     "pool/$(SECTION)";
    Packages         "$(DIST)/$(SECTION)/binary-$(ARCH)/Packages";
    Contents         "$(DIST)/Contents-$(ARCH)";
};

Tree "dists/stable" {
    Sections   "main";
    Architectures "amd64 all";
};

Default {
    Packages::Compress ". gzip xz";
    Contents::Compress ". gzip";
};

// Acquire-By-Hash writes Packages files under by-hash/SHA256/<hash> as well
// as at their plain path. A client that read Release just before a publish can
// still fetch the exact file that Release names, instead of hitting a hash
// mismatch against a half-updated Pages CDN cache.
APT::FTPArchive::Release {
    Acquire-By-Hash "yes";
    Origin      "Trace Labs";
    Label       "tlosint";
    Suite       "stable";
    Codename    "stable";
    Architectures "amd64 all";
    Components  "main";
    Description "Trace Labs OSINT tools";
};
